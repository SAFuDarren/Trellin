[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "research-multiplier"
version = "1.0.114"
description = "Turn a research question into a checkable next step."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.22,<5",
]
postgres = [
    "alembic>=1.13,<2",
    "jsonschema>=4.22,<5",
    "psycopg[binary]>=3.2.10,<4",
]

[project.scripts]
research-multiplier = "research_multiplier.cli:main"

[tool.setuptools.packages.find]
include = ["research_multiplier*"]

[tool.setuptools.package-data]
research_multiplier = [
    "agent_guide.md",
    "lean_support/*.lean",
    "migrations/*.py",
    "migrations/versions/*.py",
    "migrations/sql/*.sql",
    "schemas/*.json",
    "_compat/*.py",
    "proof/_pinned/*.py",
    "domain_packages/_pinned/*.py",
    "models/_pinned/*.py",
    "workflows/_pinned/*.py",
    "evaluations/_pinned/*.py",
    "workbench/app/*.html",
    "workbench/app/assets/*",
]

[tool.setuptools.data-files]
"share/research-multiplier/lean" = ["lean/lean-toolchain", "lean/lakefile.toml", "lean/lake-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "offline: needs only Python",
    "postgres: needs RM_TEST_DSN, a disposable PostgreSQL database with pgvector",
    "lean: needs the pinned Lean toolchain and Mathlib",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["research_multiplier/_compat", "research_multiplier/**/_pinned", "build", "tests/compat_validation"]

[tool.ruff.lint]
# Errors only for now: syntax errors and undefined names. Roadmap P0.3 widens
# the rules and adds formatting in a dedicated cleanup change.
select = ["E9", "F63", "F7", "F82"]
