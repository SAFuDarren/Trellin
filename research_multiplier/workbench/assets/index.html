<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Research Multiplier · 定理图谱</title>
  <link rel="stylesheet" href="workbench.css">
  <script src="workbench.js" defer></script>
</head>
<body>
  <div class="app" id="workbench">
    <nav class="sidebar" id="sidebar" aria-label="课题">
      <div class="brand">
        <span class="brand-name">Research Multiplier</span>
        <button id="toggle-sidebar" type="button" class="icon-button" aria-expanded="true" aria-controls="sidebar" aria-label="收起侧栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><path d="M9.5 4.5v15"></path></svg>
        </button>
      </div>
      <div class="menu">
        <label class="menu-item search" for="claim-search" title="搜索课题">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4.2-4.2"></path></svg>
          <input id="claim-search" type="search" placeholder="搜索课题" autocomplete="off">
        </label>
        <button id="menu-review" type="button" class="menu-item" aria-pressed="false" title="待你审阅">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4.5l1.5 2.5h4l1.5-2.5H20"></path><path d="M5.5 5h13L20 13v5.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V13Z"></path></svg>
          <span class="menu-label">待你审阅</span><span id="menu-review-count" class="menu-count"></span>
        </button>
        <button id="menu-library" type="button" class="menu-item" aria-pressed="false" title="定理库">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h4.5v15H5z"></path><path d="M9.5 4.5H14v15H9.5z"></path><path d="m14.5 5.2 3.8-1 3.2 14.3-3.8 1z"></path></svg>
          <span class="menu-label">定理库</span><span id="menu-library-count" class="menu-count"></span>
        </button>
        <button id="menu-atlas" type="button" class="menu-item" aria-pressed="true" title="全局图">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M4 12h16"></path><path d="M12 4c2.4 2.2 3.6 4.9 3.6 8s-1.2 5.8-3.6 8c-2.4-2.2-3.6-4.9-3.6-8S9.6 6.2 12 4Z"></path></svg>
          <span class="menu-label">全局图</span>
        </button>
        <div class="more">
          <button id="menu-more" type="button" class="menu-item" aria-expanded="false" aria-controls="more-menu" title="更多">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="18" cy="12" r="1"></circle></svg>
            <span class="menu-label">更多</span>
          </button>
          <div id="more-menu" class="popover" hidden>
            <button id="reset-layout" type="button">恢复默认布局</button>
            <button id="refresh" type="button">刷新项目</button>
          </div>
        </div>
      </div>
      <div id="claim-list" class="claim-list"></div>
      <footer class="sidebar-foot"><span id="workspace-state">正在连接项目…</span></footer>
    </nav>

    <div class="splitter" data-split="side" role="separator" aria-orientation="vertical" tabindex="0" aria-label="拖动调整课题栏宽度"></div>

    <main class="main">
      <header class="toolbar">
        <div class="claim-heading">
          <h1 id="claim-title">定理图谱</h1>
          <span id="claim-meta" class="claim-meta" hidden></span>
        </div>
        <button id="open-review" type="button" class="chip" aria-controls="review" hidden>待你审阅</button>
      </header>
      <div id="impact-controls" class="impact-bar" hidden>
        <label for="premise-select">预览改动</label>
        <select id="premise-select"></select>
        <span id="impact-state" role="status"></span>
      </div>
      <p id="notice" class="notice" role="status">正在读取项目记录…</p>

      <section id="content" class="graph-area" aria-label="当前课题的依赖图" hidden>
        <div id="stage" class="stage" tabindex="0" role="application" aria-roledescription="可缩放画布"
          aria-label="依赖图。拖动可平移；双指捏合或按住 Ctrl 滚动可缩放；加号、减号缩放，0 适合窗口。">
          <div id="plot" class="plot">
            <svg id="edges" class="graph-edges" aria-hidden="true"></svg>
            <div id="nodes" class="graph-nodes"></div>
          </div>
          <div class="segmented" id="view-tabs" role="group" aria-label="图谱视图">
            <button type="button" data-view="proof" aria-pressed="true">证明推进</button>
            <button type="button" data-view="references" aria-pressed="false">引用与领域</button>
            <button type="button" data-view="impact" aria-pressed="false">假设影响</button>
          </div>
          <figure id="atlas" class="atlas" hidden>
            <figcaption id="atlas-handle" title="拖动移动全局图"><span>全局位置</span><span id="atlas-count"></span></figcaption>
            <svg id="atlas-map" viewBox="0 0 200 150" role="img" aria-label="工作区全部课题的依赖树，虚线圈是当前课题的位置"></svg>
            <div id="atlas-keys" class="atlas-keys"></div>
            <span id="atlas-resize" class="atlas-resize" role="separator" tabindex="0" aria-label="拖动调整全局图大小" title="拖动调整大小"></span>
          </figure>
          <div class="zoom" role="group" aria-label="缩放">
            <button type="button" id="zoom-out" aria-label="缩小"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7h8"></path></svg></button>
            <button type="button" id="zoom-reset" class="zoom-level" aria-label="缩放到 100%">100%</button>
            <button type="button" id="zoom-in" aria-label="放大"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7h8M7 3v8"></path></svg></button>
            <span class="zoom-rule" aria-hidden="true"></span>
            <button type="button" id="zoom-fit" aria-label="适合窗口"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5V2h3M9 2h3v3M12 9v3H9M5 12H2V9"></path></svg></button>
          </div>
        </div>
        <div id="legend" class="legend" role="status" aria-label="图例与当前情况"></div>
      </section>

      <div class="splitter horizontal" data-split="chat" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="拖动调整对话区高度"></div>

      <section id="activity-panel" class="chat" aria-labelledby="activity-title">
        <header class="chat-head">
          <h2 id="activity-title" tabindex="-1">与模型的对话<span id="chat-target"></span></h2>
          <span id="activity-state" class="chat-state" role="status">正在读取运行记录…</span>
          <button id="chat-scope" type="button" class="chip" aria-pressed="false">全部节点</button>
          <button id="toggle-chat" type="button" class="icon-button" aria-expanded="true" aria-controls="chat-body" aria-label="收起对话">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"></path></svg>
          </button>
        </header>
        <div id="chat-body" class="chat-body">
          <ol id="activity-feed" class="chat-feed" aria-label="对话记录"></ol>
          <form id="guidance-form" class="composer">
            <label for="guidance-text" class="sr-only">给模型的意见</label>
            <textarea id="guidance-text" rows="2" maxlength="1500" required placeholder="回复这个节点上的模型，或者给它们一条研究建议"
              aria-describedby="guidance-scope guidance-status" disabled></textarea>
            <div class="composer-row">
              <label for="guidance-audience" class="sr-only">发给谁</label>
              <select id="guidance-audience" aria-describedby="guidance-scope"></select>
              <p id="guidance-scope" class="composer-note"></p>
              <button id="guidance-send" type="submit" class="send" aria-label="发送意见" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
              </button>
            </div>
            <p id="guidance-status" class="composer-status" role="status"></p>
          </form>
        </div>
      </section>
    </main>

    <div class="splitter" data-split="right" role="separator" aria-orientation="vertical" tabindex="0" aria-label="拖动调整审阅栏宽度"></div>

    <aside class="review" id="review" aria-label="待你审阅与节点详情">
      <section class="queue" aria-labelledby="queue-title">
        <header>
          <h2 id="queue-title">待你审阅</h2><span id="queue-count"></span>
          <button id="close-review" type="button" class="icon-button" aria-label="收起审阅栏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><path d="M14.5 4.5v15"></path></svg>
          </button>
        </header>
        <ul id="review-queue"></ul>
      </section>
      <section id="node-detail" class="node-detail" aria-label="节点详情"></section>
    </aside>
  </div>
</body>
</html>
