name: Bug report
description: Something does not work as documented.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, connection strings or unpublished research content. Report security problems privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or clicks, using a disposable workspace if possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show research-multiplier`, or the commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, PostgreSQL and Lean versions. `research-multiplier doctor --json` helps; remove any paths you consider private.
