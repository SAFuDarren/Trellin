name: Model catalog
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: model-catalog
  cancel-in-progress: false
jobs:
  pending-scores:
    if: github.repository == 'SAFuDarren/Trellin'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Register newly listed models
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/model_releases.py --publish
