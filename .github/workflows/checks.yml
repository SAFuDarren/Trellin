name: Checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 18 * * 1'
  workflow_dispatch:
    inputs:
      validation_url:
        description: Optional HTTPS URL of a historical matching validation archive
        required: false
        type: string
      validation_sha256:
        description: SHA-256 required when overriding the checked-in validation source
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package-smoke:
    name: Installed package smoke check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/rm-dist" .
          wheels=("$RUNNER_TEMP"/rm-dist/research_multiplier-*.whl)
          python -m pip install "${wheels[0]}"
      - name: Exercise offline commands outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          RM_SMOKE_ROOT: ${{ runner.temp }}/rm-smoke-project
        shell: bash
        run: |
          unset PYTHONPATH
          research-multiplier research init-workspace "$RM_SMOKE_ROOT"
          research-multiplier --workspace "$RM_SMOKE_ROOT" init "$RM_SMOKE_ROOT/inputs/question.json"
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          import research_multiplier

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if Path(research_multiplier.__file__).resolve().is_relative_to(workspace):
              raise SystemExit("The smoke check must run against the installed wheel.")
          question = Path(os.environ["RM_SMOKE_ROOT"]) / "inputs" / "question.json"
          template = json.loads(question.read_text(encoding="utf-8"))
          template.update(title="Smoke check", question="What can this run record?", success="A replayable brief")
          question.write_text(json.dumps(template), encoding="utf-8")
          PYCODE
          research-multiplier --workspace "$RM_SMOKE_ROOT" run "$RM_SMOKE_ROOT/inputs/question.json"
          runs=("$RM_SMOKE_ROOT"/runs/offline/run-*/run.json)
          research-multiplier replay "${runs[0]}"
          research-multiplier --workspace "$RM_SMOKE_ROOT" lean prepare

  postgres:
    name: Required release regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the first parent is the base.
          fetch-depth: 2
      - name: Decide whether this change needs the PostgreSQL and Lean regressions
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import os
          import re
          import subprocess

          # Changes confined to these paths cannot affect the database boundary or
          # proof checking (#169). Everything else, and every push to main, schedule
          # or manual run, gets the full regressions.
          SAFE = (
              re.compile(r"web/"),
              re.compile(r"research_multiplier/workbench/app/"),
              re.compile(r"docs/"),
              re.compile(r"brand/"),
              re.compile(r"desktop/"),
              re.compile(r"\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$)"),
              re.compile(r"[^/]+\.md$"),
              re.compile(r"tests/compat_validation/PACKAGE_VERSION$"),
          )

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout

          def version_only(path):
              # pyproject.toml may change only its static [project] version line.
              lines = [line for line in git("diff", "--unified=0", "HEAD^1", "HEAD", "--", path).splitlines()
                       if line[:1] in "+-" and not line.startswith(("+++", "---"))]
              return bool(lines) and all(re.fullmatch(r'[+-]version = "[0-9.]+"', line) for line in lines)

          full, reason = True, f"{os.environ['EVENT']} runs the full regressions"
          if os.environ["EVENT"] == "pull_request":
              files = git("diff", "--name-only", "HEAD^1", "HEAD").split()
              other = [f for f in files if not any(p.match(f) for p in SAFE)
                       and not (f == "pyproject.toml" and version_only(f))]
              full = bool(other) or not files
              reason = (f"changes outside the interface and records, for example {other[0]}" if other
                        else "only the interface, documentation and version records changed")
          print(f"Full regressions: {full} ({reason})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"full={'true' if full else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"PostgreSQL and Lean regressions: {'run' if full else 'skipped'} ({reason}).\n")
          PYCODE
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/rm-dist" .
          wheels=("$RUNNER_TEMP"/rm-dist/research_multiplier-*.whl)
          python -m pip install "${wheels[0]}[dev,postgres]"
      - name: Select the version-matched compatibility tests
        working-directory: ${{ runner.temp }}
        env:
          RM_VALIDATION_URL: ${{ inputs.validation_url }}
          RM_VALIDATION_SHA256: ${{ inputs.validation_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          from hashlib import file_digest
          from importlib.metadata import version
          import os
          from pathlib import Path
          import re
          import subprocess
          import tarfile

          url = os.environ["RM_VALIDATION_URL"].strip()
          expected = os.environ["RM_VALIDATION_SHA256"].strip().lower()
          directory = Path(os.environ["GITHUB_WORKSPACE"]) / "tests" / "compat_validation"
          if url or expected:
              if not url.startswith("https://") or not re.fullmatch(r"[0-9a-f]{64}", expected):
                  raise SystemExit("An archive override needs both a matching HTTPS URL and SHA-256.")
              archive = Path("rm-validation.tar.gz")
              curl = ["curl", "--fail", "--location", "--retry", "3", "--max-time", "120",
                      "--proto", "=https", "--max-filesize", "32000000"]
              # Authenticate only to the same repository's pinned Git blob.
              api = os.environ["GITHUB_API_URL"].rstrip("/")
              blobs = f'{api}/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/'
              headers = None
              if re.fullmatch(re.escape(blobs) + r"[0-9a-f]{40}", url):
                  curl += ["--header", "@-"]
                  headers = f'Authorization: Bearer {os.environ["GH_TOKEN"]}\nAccept: application/vnd.github.raw+json\n'
              subprocess.run(curl + ["--output", str(archive), "--", url], input=headers, text=True, check=True)
              with archive.open("rb") as stream:
                  if file_digest(stream, "sha256").hexdigest() != expected:
                      raise SystemExit("Validation archive SHA-256 differs from the requested digest.")
              directory = Path("rm-validation").resolve()
              directory.mkdir()
              with tarfile.open(archive, "r:gz") as content:
                  content.extractall(directory, filter="data")
          required = ("PACKAGE_VERSION", "run_regressions.py", "check_cli_compatibility.py", "cli-baseline.json")
          if not all((directory / name).is_file() for name in required) or not (directory / "tests").is_dir():
              raise SystemExit("The selected suite must contain its version, runner and CLI baseline.")
          if (directory / "PACKAGE_VERSION").read_text(encoding="ascii").strip() != version("research-multiplier"):
              raise SystemExit("Select the validation source for the installed candidate version.")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"RM_VALIDATION_DIR={directory.resolve()}\n")
          PYCODE
      - name: Check existing commands against the pinned baseline
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          candidate=$(python -c 'from importlib.metadata import distribution; print(distribution("research-multiplier").locate_file(""))')
          python "$RM_VALIDATION_DIR/check_cli_compatibility.py" "$RM_VALIDATION_DIR/cli-baseline.json" "$candidate"
      - name: Install native PostgreSQL 18 and pgvector
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          pgdg_key="$RUNNER_TEMP/postgresql-pgdg.asc"
          curl --fail --location --retry 3 --output "$pgdg_key" \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          primary_fingerprint=$(gpg --batch --show-keys --with-colons "$pgdg_key" |
            awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')
          test "$primary_fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "$pgdg_key" /usr/share/keyrings/research-multiplier-pgdg.asc
          sudo tee /etc/apt/sources.list.d/research-multiplier-pgdg.sources >/dev/null <<'APT'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/keyrings/research-multiplier-pgdg.asc
          APT
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-18-pgvector
      - name: Start a disposable PostgreSQL cluster
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          pg_bin=/usr/lib/postgresql/18/bin
          echo "$pg_bin" >> "$GITHUB_PATH"
          pg_data="$RUNNER_TEMP/rm-postgres-data"
          pg_socket="$RUNNER_TEMP/rm-postgres-socket"
          pg_port=55439
          mkdir -m 0700 "$pg_socket"
          "$pg_bin/initdb" -D "$pg_data" -U postgres --locale=C --encoding=UTF8 \
            --auth-local=trust --auth-host=scram-sha-256
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/rm-postgres.log" \
            -o "-c listen_addresses='' -k '$pg_socket' -p $pg_port" -w start
          "$pg_bin/createdb" -h "$pg_socket" -p "$pg_port" -U postgres research_multiplier_test
          "$pg_bin/psql" -h "$pg_socket" -p "$pg_port" -U postgres -d research_multiplier_test \
            --no-psqlrc --set ON_ERROR_STOP=1 --command 'CREATE EXTENSION vector;' \
            --command "SELECT version(), extversion FROM pg_extension WHERE extname = 'vector';"
          echo "RM_TEST_DSN=postgresql:///research_multiplier_test?user=postgres&host=$pg_socket&port=$pg_port" >> "$GITHUB_ENV"
      - name: Verify installed schema against disposable PostgreSQL
        if: steps.scope.outputs.full == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          python - <<'PYCODE'
          import os
          from pathlib import Path

          import psycopg

          import research_multiplier
          from research_multiplier.storage.migrate import migration_head, upgrade

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if Path(research_multiplier.__file__).resolve().is_relative_to(workspace):
              raise SystemExit("Run the schema check against the installed wheel.")
          dsn = os.environ["RM_TEST_DSN"]
          for revision in ("0007", "0014", "0020", "0024", "0025", "0029", "0032",
                           "0034", "0036", "0040", "0066", "head"):
              upgrade(dsn, revision)
          with psycopg.connect(dsn) as connection:
              if connection.execute("SELECT version_num FROM public.rm_alembic_version").fetchone() != (migration_head(),):
                  raise SystemExit("The disposable database did not reach the installed schema head.")
          PYCODE
      - name: Run the in-repository PostgreSQL tests
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          python -m pytest --import-mode=importlib -p no:cacheprovider -m postgres "$GITHUB_WORKSPACE/tests"
      - name: Run the compatibility PostgreSQL suite
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          pg_dump --version
          pg_restore --version
          python "$RM_VALIDATION_DIR/run_regressions.py" postgres
      - name: Prepare the pinned Lean project
        if: steps.scope.outputs.full == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          archive="$RUNNER_TEMP/lean-4.19.0-linux.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          lean_bin="$RUNNER_TEMP/lean-4.19.0-linux/bin"
          echo "$lean_bin" >> "$GITHUB_PATH"
          export PATH="$lean_bin:$PATH"
          rm_workspace="$RUNNER_TEMP/rm-lean-tests"
          research-multiplier research init-workspace "$rm_workspace"
          research-multiplier --workspace "$rm_workspace" lean prepare
          # The fixture is shared by tests whose temporary workspaces are separate.
          rm_lean_fixture="$RUNNER_TEMP/rm-lean-fixture"
          mv "$rm_workspace/lean-project" "$rm_lean_fixture"
          cd "$rm_lean_fixture"
          lake exe cache get Mathlib.Data.Real.Basic Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum
      - name: Run the in-repository Lean tests
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          python -m pytest --import-mode=importlib -p no:cacheprovider -m lean "$GITHUB_WORKSPACE/tests"
      - name: Run required Lean regressions
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 22
        env:
          RM_TEST_LEAN_PROJECT: ${{ runner.temp }}/rm-lean-fixture
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          python "$RM_VALIDATION_DIR/run_regressions.py" release-lean --workers 2
      - name: Stop the PostgreSQL cluster
        if: always()
        run: |
          pg_data="$RUNNER_TEMP/rm-postgres-data"
          if [[ -f "$pg_data/postmaster.pid" ]]; then
            /usr/lib/postgresql/18/bin/pg_ctl -D "$pg_data" -m fast -w stop
          fi
