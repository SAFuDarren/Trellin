name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: Lint and offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package with development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Offline tests
        run: python -m pytest -m offline
      - name: The wheel ships no tests
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/rm-wheel" .
          python - "$RUNNER_TEMP/rm-wheel" <<'PYCODE'
          import sys, zipfile
          from pathlib import Path
          wheel, = Path(sys.argv[1]).glob("research_multiplier-*.whl")
          leaked = [name for name in zipfile.ZipFile(wheel).namelist() if name.startswith("tests/")]
          if leaked:
              raise SystemExit(f"Test files leaked into the wheel: {leaked[:5]}")
          PYCODE

  web:
    name: Web interface (React)
    # Pinned: the Playwright version in web/package.json supports Ubuntu 24.04 but not later runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies from the lock file
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile
      - name: Type check, lint and formatting
        run: |
          npx --yes pnpm@9.15.4 typecheck
          npx --yes pnpm@9.15.4 lint
          npx --yes pnpm@9.15.4 format:check
      - name: Unit tests
        run: npx --yes pnpm@9.15.4 test
      - name: The committed build matches the source
        run: |
          npx --yes pnpm@9.15.4 build
          git -C .. status --porcelain -- research_multiplier/workbench/app
          test -z "$(git -C .. status --porcelain -- research_multiplier/workbench/app)"
      # Uses the Google Chrome that the runner image already has. Downloading Playwright's
      # Chromium has hung after the download finished, so CI no longer depends on it.
      - name: End-to-end parity tests (Playwright)
        timeout-minutes: 10
        env:
          PW_CHANNEL: chrome
        run: npx --yes pnpm@9.15.4 e2e
