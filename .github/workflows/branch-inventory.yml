name: Branch inventory
on:
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: branch-inventory
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'SAFuDarren/Trellin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh the weekly inventory comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/tasks.py branches --json | python3 scripts/branch_report.py --publish
